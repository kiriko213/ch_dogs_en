name: AI Shorts Post (Dogs EN)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # 3 times a day JST 21:10, 10:40, 14:10 (UTC 12:10, 01:40, 05:10)
    - cron: '10 12 * * *'
    - cron: '40 1 * * *'
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-color-emoji

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --upgrade edge-tts

    - name: Run Auto Post
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DOGS_EN }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_DOGS_EN }}
        YOUTUBE_CLIENT_ID_DOGS_EN: ${{ secrets.YOUTUBE_CLIENT_ID_DOGS_EN }}
        YOUTUBE_CLIENT_SECRET_DOGS_EN: ${{ secrets.YOUTUBE_CLIENT_SECRET_DOGS_EN }}
        YOUTUBE_REFRESH_TOKEN_DOGS_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DOGS_EN }}
        YOUTUBE_TOKEN_DOGS_EN_B64: ${{ secrets.YOUTUBE_TOKEN_DOGS_EN_B64 }}
        YT_ANALYTICS_TOKEN_DOGS_EN_B64: ${{ secrets.YT_ANALYTICS_TOKEN_DOGS_EN_B64 }}
        GITHUB_ACTIONS: "true"
        PYTHONUNBUFFERED: "1"
      run: |
        echo "【English Dog Channel】Starting automated production..."
        python auto_main.py
