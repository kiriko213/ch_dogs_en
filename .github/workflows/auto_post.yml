name: AI Shorts Post (Dogs EN)

on:
  schedule:
    # 4 times a day aligned with North American EST
    # EST 08:00 -> UTC 12:00
    # EST 12:00 -> UTC 16:00
    # EST 18:00 -> UTC 22:00
    # EST 22:00 -> UTC 02:00
    - cron: '25 23,8,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-color-emoji

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Auto Post
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DOGS_EN }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_DOGS_EN }}
        YOUTUBE_CLIENT_ID_DOGS_EN: ${{ secrets.YOUTUBE_CLIENT_ID_DOGS_EN }}
        YOUTUBE_CLIENT_SECRET_DOGS_EN: ${{ secrets.YOUTUBE_CLIENT_SECRET_DOGS_EN }}
        YOUTUBE_REFRESH_TOKEN_DOGS_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DOGS_EN }}
        GITHUB_ACTIONS: "true"
        PYTHONUNBUFFERED: "1"
      run: |
        echo "【English Dog Channel、EStarting automated production..."
        python auto_main.py


